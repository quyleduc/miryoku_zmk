
name: 'Build Corne 3x5 Optimized'

on:
  workflow_dispatch:
  push:
    branches:
      - feature/corne-oled-dashboard-v1
  pull_request:
    branches:
      - feature/miryoku-fast-base-v2

jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano@2.0.0//zmk"]'
      shield: '["corne_left","corne_right"]'
      alphas: '["qwerty"]'
      clipboard: '["win"]'
      tap: '["qwerty"]'
      extra: '["qwerty"]'
      kconfig: '["CONFIG_ZMK_DISPLAY=y\nCONFIG_BT_CTLR_TX_PWR_PLUS_8=y"]'
      zmk_sha: '4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85'
