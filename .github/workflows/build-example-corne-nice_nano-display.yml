
name: 'Build Corne 3x5 Optimized'

on:
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano@2.0.0"]'
      shield: '["corne_left","corne_right"]'
      alphas: '["qwerty"]'
      clipboard: '["win"]'
      tap: '["qwerty"]'
      extra: '["qwerty"]'
      kconfig: '["CONFIG_ZMK_DISPLAY=y\nCONFIG_BT_CTLR_TX_PWR_PLUS_8=y"]'
