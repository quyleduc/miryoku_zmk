name: Deploy LQE2HC Layer Tutor to GitHub Pages (manual)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run LQE2HC tests before publishing
        working-directory: trainer/typing-tutor
        run: node --test tests/*.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package website
        uses: actions/upload-pages-artifact@v3
        with:
          path: trainer/typing-tutor/
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
