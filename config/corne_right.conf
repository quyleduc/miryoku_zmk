# Split peripheral: only local battery and central BLE-link status.
# No central-only layer or WPM APIs; no animation or unnecessary timers.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
